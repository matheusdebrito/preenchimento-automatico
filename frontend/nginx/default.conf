# Access log without client IP or query string to reduce personal data exposure.
log_format minimal '$request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout minimal;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'" always;

    # Endpoint de saúde do container, sem expor informação da aplicação.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Same-origin API proxy: keep HTTP-only sessions private and avoid browser CORS complexity.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        client_max_body_size 11m;
        proxy_read_timeout 180s;
    }

    # Assets gerados pelo Vite têm hash no nome e podem ser cacheados.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
    }

    # SPA: rotas do React Router recebem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
