name: One-time accented PDF visual verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-accent-review.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Compile PDF engine
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Install render utilities
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate samples with accented fake names
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render and remove intermediate PDFs
        run: |
          find docs/_pdf_test_previews -type f -name synthetic.pdf | while read -r file; do
            d=$(dirname "$file")
            pdftoppm -r 110 -scale-to 1200 -png "$file" "$d/page"
            rm "$file"
          done
      - name: Commit only synthetic image previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_pdf_test_previews
          if ! git diff --cached --quiet; then
            git commit -m 'test(pdf): refresh accented synthetic form images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
