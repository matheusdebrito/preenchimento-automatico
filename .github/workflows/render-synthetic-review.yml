name: One-time mapping review previews (alignment pass 2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-synthetic-review.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and compile PDF code
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Install image renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Fill official blanks only with labelled synthetic values
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render every synthetic PDF page and remove PDF intermediates
        run: |
          find docs/_pdf_test_previews -type f -name synthetic.pdf | sort | while read -r file; do
            directory=$(dirname "$file")
            pdftoppm -r 110 -scale-to 1200 -png "$file" "$directory/page"
            rm "$file"
          done
      - name: Commit only fictitious preview PNG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_pdf_test_previews
          if ! git diff --cached --quiet; then
            git commit -m 'test(pdf): refresh synthetic previews of mapped templates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
