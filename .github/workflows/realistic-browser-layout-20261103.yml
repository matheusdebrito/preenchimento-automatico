name: Browser PDF visual QA realistic values
on:
  push:
    branches:
      - test/browser-realistic-pdf-layout-20261103
permissions:
  contents: read
concurrency:
  group: realistic-browser-pdf-qa-20261103
  cancel-in-progress: false
jobs:
  chromium-pdf-realistic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      POSTGRES_PASSWORD: test_only_realistic_pdf_qa
      OPENAI_API_KEY: ""
      DEV_GRANT_SECRET: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies and browser
        run: |
          npm ci --prefix frontend
          npm install --no-save --package-lock=false --prefix frontend playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Start isolated app and database
        run: docker compose up -d --build
      - name: Health check
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1
      - name: Prepare realistic field values
        run: node frontend/scripts/realistic-qa-transform.mjs
      - name: Execute full browser service matrix, fill, and download PDFs
        run: node frontend/scripts/e2e-service-matrix-realistic.mjs
      - name: Preserve service evidence
        if: always()
        run: |
          mkdir -p browser-matrix-results
          docker compose ps > browser-matrix-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail=120 > browser-matrix-results/compose-logs.txt 2>&1 || true
      - name: Upload browser PDFs, logs and screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-realistic-pdf-qa
          path: browser-matrix-results/
          retention-days: 7
      - name: Destroy isolated test environment
        if: always()
        run: docker compose down -v || true
