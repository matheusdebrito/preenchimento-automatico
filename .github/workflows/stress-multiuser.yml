name: Estresse multiusuario (isolado)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stress-multiuser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stress-multiuser:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/split-job-admission-and-heavy-work-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: stress_test_password_2026_only
      OPENAI_API_KEY: ""
      DEV_GRANT_SECRET: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare isolated Docker Compose services
        run: docker compose up -d --build
      - name: Wait for local service readiness
        shell: bash
        run: |
          for i in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:8080/api/services > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1
      - name: Seed 130 distinct test-only accounts and sessions in ephemeral Postgres
        shell: bash
        run: |
          node backend/scripts/stress-multiuser.mjs seed "$RUNNER_TEMP/stress-session-tokens.json" "$RUNNER_TEMP/stress-seed.sql"
          docker compose exec -T db psql -U preenchimento -d preenchimento -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/stress-seed.sql" > /dev/null
      - name: Simulate concurrent catalog access and manual PDF generation
        shell: bash
        run: |
          set -e
          mkdir -p stress-results
          (
            while true; do
              date -u +%FT%TZ
              docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' || true
              sleep 2
            done
          ) > stress-results/container-resource-samples.txt 2>&1 &
          MONITOR_PID=$!
          trap 'kill "$MONITOR_PID" 2>/dev/null || true' EXIT
          node backend/scripts/stress-multiuser.mjs run "$RUNNER_TEMP/stress-session-tokens.json"
      - name: Collect diagnostics without secrets
        if: always()
        run: |
          mkdir -p stress-results
          docker compose ps > stress-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail=120 > stress-results/container-logs.txt 2>&1 || true
          rm -f "$RUNNER_TEMP/stress-session-tokens.json" "$RUNNER_TEMP/stress-seed.sql"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-multiuser-130-testusers
          path: stress-results/
          retention-days: 7
      - name: Destroy temporary database and containers
        if: always()
        run: docker compose down -v || true
