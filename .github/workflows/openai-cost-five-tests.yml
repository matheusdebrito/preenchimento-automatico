name: Cinco custos OpenAI - sintéticos (manual)
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo a testar (um modelo por execucao)
        type: choice
        required: true
        default: gpt-5.4-mini-2026-03-17
        options:
          - gpt-5.4-mini-2026-03-17
          - gpt-5.4-nano-2026-03-17
permissions:
  contents: read
concurrency:
  group: openai-five-real-cost-tests
  cancel-in-progress: false
jobs:
  five-synthetic-analyses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies and build the production extractor
        run: |
          npm ci --prefix backend
          npm run build --prefix backend
      - name: Install synthetic image rendering dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Run exactly five synthetic extraction scenarios
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT_ID: ${{ vars.OPENAI_PROJECT_ID }}
          OPENAI_MODEL: ${{ inputs.model }}
          OPENAI_DOCUMENT_DETAIL: high
          BENCH_REPORT_DIR: openai-cost-results
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY must be configured in Actions repository secrets."
            exit 1
          fi
          node backend/scripts/openai-cost-benchmark.mjs
      - name: Upload metrics only, never raw documents or responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-five-synthetic-cost-measurements
          path: openai-cost-results/
          if-no-files-found: warn
          retention-days: 7
