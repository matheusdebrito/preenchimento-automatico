name: CI
# Pull requests para main voltam a usar o pipeline como gate de entrega.
# O disparo manual permanece disponível para validações ad hoc.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: paths
        name: Detect affected areas
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
              base="HEAD^"
            fi
          fi

          files="$(git diff --name-only "$base" HEAD || true)"
          printf '%s\n' "$files"

          changed() {
            printf '%s\n' "$files" | grep -Eq "$1"
          }

          backend=false
          frontend=false

          if changed '^(backend/|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            backend=true
          fi
          if changed '^(frontend/|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            frontend=true
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  backend-checks:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend-checks:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  postgres-integration:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: test_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_app -d test_app"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_TEST_URL: postgresql://test_app:test_password_ci_only@127.0.0.1:5432/test_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run database integration tests
        working-directory: backend
        run: >-
          npx vitest run
          src/modules/auth/auth.integration.test.ts
          src/modules/auth/job-credit.integration.test.ts
          src/modules/auth/db.integration.test.ts
          --maxWorkers=1

  normam211-inspection:
    needs: detect-changes
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils qpdf
      - name: Inspect NORMAM-211 PDF structure and hashes
        working-directory: backend
        run: node scripts/inspect-normam211.mjs
      - name: Render and extract every NORMAM-211 annex
        shell: bash
        run: |
          find docs/_normam211_inspection -type f -name '*.pdf' -print0 | while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            pdfinfo "$file" > "$directory/pdfinfo.txt"
            qpdf --check "$file" > "$directory/qpdf-check.txt" 2>&1
            pdffonts "$file" > "$directory/pdffonts.txt"
            pdftotext -layout "$file" "$directory/text.txt" || true
            pdftoppm -r 160 -png "$file" "$directory/page"
          done
      - name: Attach inspection evidence for page-by-page review
        uses: actions/upload-artifact@v4
        with:
          name: normam211-homologation-inspection
          path: docs/_normam211_inspection
          retention-days: 7
          if-no-files-found: error

  compose-smoke:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: local_ci_password_only
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API and frontend without local OCR runtime
        run: docker compose build api frontend
      - name: Confirm legacy OCR service is absent
        run: |
          ! docker compose config --services | grep -qx ocr
          ! grep -R -n -E 'PADDLE_OCR_URL|paddleocr' compose.yaml backend/src/routes/jobs.ts frontend/src/features/real/LiveFlowPage.tsx


  pdf-mapping-visual:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build the PDF mapper
        working-directory: backend
        run: npm run build
      - name: Install Poppler renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate review-only samples with synthetic names and CPFs
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render every page and assert the sample watermark
        run: |
          find docs/_pdf_test_previews -type f -name 'synthetic*.pdf' | sort | while read -r file; do
            directory=$(dirname "$file")
            basename=$(basename "$file" .pdf)
            pdftotext "$file" - | grep -q "AMOSTRA - DADOS FICTICIOS - NAO UTILIZAR"
            pdftoppm -r 140 -png "$file" "$directory/$basename-layout"
          done
      - name: Reject broad black-band rendering artifacts
        run: python3 backend/scripts/assert-pdf-visual-sanity.py
      - name: Attach PDFs and PNGs for manual page-by-page QA
        uses: actions/upload-artifact@v4
        with:
          name: pdf-mapping-review-synthetic
          path: docs/_pdf_test_previews
          retention-days: 7
          if-no-files-found: error

  browser-e2e:
    # Opt-in for manual CI runs, plus this dedicated smoke-test PR.
    # Keeping it opt-in prevents expensive browser setup on every code change.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'test/browser-e2e-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: browser_ci_only_strong_password
      OPENAI_API_KEY: ""
      DEV_GRANT_SECRET: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and temporary Playwright runner
        run: |
          npm ci --prefix frontend
          npm install --no-save --package-lock=false --prefix frontend playwright@1.56.1
      - name: Start isolated PostgreSQL + API + nginx frontend
        run: docker compose up -d --build
      - name: Wait for local API and frontend health
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null &&
               curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=120
          exit 1
      - name: Run Chromium end-to-end browser test without real uploads or OpenAI
        run: node frontend/scripts/browser-e2e.mjs
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p browser-qa-results
          docker compose ps > browser-qa-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail=200 > browser-qa-results/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-browser-e2e-evidence
          path: browser-qa-results
          retention-days: 7
      - name: Destroy test database and containers
        if: always()
        run: docker compose down -v || true
