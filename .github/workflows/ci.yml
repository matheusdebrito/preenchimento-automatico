name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Audit production dependencies
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint
      - name: Tests
        working-directory: ${{ matrix.package }}
        run: npm test
      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: test_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_app -d test_app"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_TEST_URL: postgresql://test_app:test_password_ci_only@127.0.0.1:5432/test_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
