name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Audit production dependencies
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint
      - name: Tests
        working-directory: ${{ matrix.package }}
        run: npm test
      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: test_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_app -d test_app"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_TEST_URL: postgresql://test_app:test_password_ci_only@127.0.0.1:5432/test_app
      PADDLE_OCR_URL: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Install PDF validation tool
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Build and start PaddleOCR
        run: |
          docker build -t preenchimento-ocr-ci ./ocr-service
          docker run -d --name preenchimento-ocr-ci -p 127.0.0.1:18000:8000 preenchimento-ocr-ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs preenchimento-ocr-ci
          exit 1
      - run: npm test
        working-directory: backend
      - name: Stop PaddleOCR
        if: always()
        run: docker rm -f preenchimento-ocr-ci || true

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: local_ci_password_only
      POSTGRES_USER: preenchimento
      POSTGRES_DB: preenchimento
      # Force same-origin detection through the real Nginx proxy; do not rely on CORS.
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build local containers
        run: docker compose build
      - name: Start local stack
        run: docker compose up -d
      - name: Check API and same-origin proxy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && \
               curl -fsS http://127.0.0.1:8080/api/services >/dev/null; then
              curl -fsS http://127.0.0.1:8080/api/services
              # A legitimate browser POST must reach auth (401: unknown user),
              # while a cross-site POST must be blocked before authentication (403).
              local_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Origin: http://127.0.0.1:8080' -H 'Content-Type: application/json' \
                --data '{"email":"missing@example.invalid","password":"temporary-test-password"}' \
                http://127.0.0.1:8080/api/auth/login)
              foreign_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Origin: https://malicious.example' -H 'Content-Type: application/json' \
                --data '{"email":"missing@example.invalid","password":"temporary-test-password"}' \
                http://127.0.0.1:8080/api/auth/login)
              test "$local_status" = "401"
              test "$foreign_status" = "403"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1
      - name: Verify PaddleOCR inside the built OCR container
        run: docker compose exec -T ocr python /app/smoke.py
      - name: Stop and delete test volumes
        if: always()
        run: docker compose down -v --remove-orphans

  pdf-mapping-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build the PDF mapper
        working-directory: backend
        run: npm run build
      - name: Install Poppler renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate review-only samples with synthetic names and CPFs
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render every page and assert the sample watermark
        run: |
          find docs/_pdf_test_previews -type f -name synthetic.pdf | sort | while read -r file; do
            directory=$(dirname "$file")
            pdftotext "$file" - | grep -q "AMOSTRA - DADOS FICTICIOS - NAO UTILIZAR"
            pdftoppm -r 140 -png "$file" "$directory/layout"
          done
      - name: Attach PDFs and PNGs for manual page-by-page QA
        uses: actions/upload-artifact@v4
        with:
          name: pdf-mapping-review-synthetic
          path: docs/_pdf_test_previews
          retention-days: 7
          if-no-files-found: error
