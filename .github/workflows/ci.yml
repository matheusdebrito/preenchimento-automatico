name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      ocr: ${{ steps.paths.outputs.ocr }}
      reference: ${{ steps.paths.outputs.reference }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: paths
        name: Detect affected areas
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
              base="HEAD^"
            fi
          fi

          files="$(git diff --name-only "$base" HEAD || true)"
          printf '%s\n' "$files"

          changed() {
            printf '%s\n' "$files" | grep -Eq "$1"
          }

          backend=false
          frontend=false
          ocr=false
          reference=false

          if changed '^(backend/|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            backend=true
          fi
          if changed '^(frontend/|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            frontend=true
          fi
          if changed '^(ocr-service/|backend/src/modules/jobs/|backend/src/modules/document-understanding/|backend/src/routes/qa-preview\.integration\.test\.ts$|backend/src/routes/jobs\.integration\.test\.ts$|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            ocr=true
          fi
          if changed '^(documentos/|ocr-service/|backend/src/modules/jobs/(paddle-ocr|pdf-paddle-pages|pdf-text-observation|reference-documents\.integration|reference-pdf-fast\.integration)\.|backend/src/modules/document-understanding/|compose\.yaml$|\.github/workflows/ci\.yml$)'; then
            reference=true
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "ocr=$ocr"
            echo "reference=$reference"
          } >> "$GITHUB_OUTPUT"

  backend-checks:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend-checks:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  postgres-integration:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: test_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_app -d test_app"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_TEST_URL: postgresql://test_app:test_password_ci_only@127.0.0.1:5432/test_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run database integration tests
        working-directory: backend
        run: >-
          npx vitest run
          src/modules/auth/auth.integration.test.ts
          src/modules/auth/job-credit.integration.test.ts
          src/modules/auth/db.integration.test.ts
          --maxWorkers=1

  ocr-integration:
    needs: detect-changes
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.ocr == 'true' ||
      needs.detect-changes.outputs.reference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: test_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_app -d test_app"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DATABASE_TEST_URL: postgresql://test_app:test_password_ci_only@127.0.0.1:5432/test_app
      PADDLE_OCR_URL: http://127.0.0.1:18000
      OCR_IMAGE: preenchimento-ocr-ci:${{ github.sha }}
      POSTGRES_PASSWORD: local_ci_password_only
      POSTGRES_USER: preenchimento
      POSTGRES_DB: preenchimento
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v5

      - name: Node.js 24
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.ocr == 'true' ||
          needs.detect-changes.outputs.reference == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.ocr == 'true' ||
          needs.detect-changes.outputs.reference == 'true'
        working-directory: backend
        run: npm ci

      - name: Install PDF tools
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.ocr == 'true' ||
          needs.detect-changes.outputs.reference == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Test adaptive OCR sizing
        if: github.event_name == 'push' || needs.detect-changes.outputs.ocr == 'true'
        run: python -m unittest discover -s ocr-service -p 'test_*.py'

      - name: Inspect reference PDF text layer safely
        if: github.event_name == 'push' || needs.detect-changes.outputs.reference == 'true'
        working-directory: backend
        env:
          REFERENCE_DOCUMENT_FAST: '1'
        run: npx vitest run src/modules/jobs/reference-pdf-fast.integration.test.ts --maxWorkers=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PaddleOCR image once
        uses: docker/build-push-action@v6
        with:
          context: ./ocr-service
          load: true
          tags: ${{ env.OCR_IMAGE }}
          cache-from: type=gha,scope=ocr-service
          cache-to: type=gha,mode=max,scope=ocr-service

      - name: Start shared PaddleOCR for integration tests
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.ocr == 'true' ||
          needs.detect-changes.outputs.reference == 'true'
        run: |
          docker run -d --name preenchimento-ocr-ci -p 127.0.0.1:18000:8000 "$OCR_IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs preenchimento-ocr-ci
          exit 1

      - name: Run synthetic OCR integration tests
        if: github.event_name == 'push' || needs.detect-changes.outputs.ocr == 'true'
        working-directory: backend
        run: >-
          npx vitest run
          src/routes/jobs.integration.test.ts
          src/routes/qa-preview.integration.test.ts
          --maxWorkers=1

      - name: Validate repository reference documents serially
        if: github.event_name == 'push' || needs.detect-changes.outputs.reference == 'true'
        working-directory: backend
        env:
          REFERENCE_DOCUMENT_OCR: '1'
        run: npx vitest run src/modules/jobs/reference-documents.integration.test.ts --maxWorkers=1

      - name: Stop standalone PaddleOCR
        if: always()
        run: docker rm -f preenchimento-ocr-ci || true

      - name: Validate Compose configuration
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.backend == 'true' ||
          needs.detect-changes.outputs.frontend == 'true' ||
          needs.detect-changes.outputs.ocr == 'true'
        run: docker compose config --quiet

      - name: Build application containers without rebuilding OCR
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.backend == 'true' ||
          needs.detect-changes.outputs.frontend == 'true' ||
          needs.detect-changes.outputs.ocr == 'true'
        run: docker compose build api frontend

      - name: Start local stack with prebuilt OCR image
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.backend == 'true' ||
          needs.detect-changes.outputs.frontend == 'true' ||
          needs.detect-changes.outputs.ocr == 'true'
        run: docker compose up -d --no-build

      - name: Check API and same-origin proxy
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.backend == 'true' ||
          needs.detect-changes.outputs.frontend == 'true' ||
          needs.detect-changes.outputs.ocr == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null && \
               curl -fsS http://127.0.0.1:8080/api/services >/dev/null; then
              curl -fsS http://127.0.0.1:8080/api/services
              local_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Origin: http://127.0.0.1:8080' -H 'Content-Type: application/json' \
                --data '{"email":"missing@example.invalid","password":"temporary-test-password"}' \
                http://127.0.0.1:8080/api/auth/login)
              foreign_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H 'Origin: https://malicious.example' -H 'Content-Type: application/json' \
                --data '{"email":"missing@example.invalid","password":"temporary-test-password"}' \
                http://127.0.0.1:8080/api/auth/login)
              test "$local_status" = "401"
              test "$foreign_status" = "403"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1

      - name: Verify PaddleOCR inside the Compose OCR container
        if: >-
          github.event_name == 'push' ||
          needs.detect-changes.outputs.backend == 'true' ||
          needs.detect-changes.outputs.frontend == 'true' ||
          needs.detect-changes.outputs.ocr == 'true'
        run: docker compose exec -T ocr python /app/smoke.py

      - name: Stop and delete Compose test volumes
        if: always()
        run: docker compose down -v --remove-orphans || true

  reference-documents:
    needs: [detect-changes, ocr-integration]
    if: >-
      always() &&
      (github.event_name == 'push' || needs.detect-changes.outputs.reference == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm shared OCR/reference validation
        run: |
          echo "reference-documents is executed inside ocr-integration to reuse one PaddleOCR image."
          test "${{ needs.ocr-integration.result }}" = "success"

  normam211-inspection:
    needs: detect-changes
    if: >-
      github.event_name == 'push' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.reference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils qpdf
      - name: Inspect NORMAM-211 PDF structure and hashes
        working-directory: backend
        run: node scripts/inspect-normam211.mjs
      - name: Render and extract every NORMAM-211 annex
        shell: bash
        run: |
          find docs/_normam211_inspection -type f -name '*.pdf' -print0 | while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            pdfinfo "$file" > "$directory/pdfinfo.txt"
            qpdf --check "$file" > "$directory/qpdf-check.txt" 2>&1
            pdffonts "$file" > "$directory/pdffonts.txt"
            pdftotext -layout "$file" "$directory/text.txt" || true
            pdftoppm -r 160 -png "$file" "$directory/page"
          done
      - name: Attach inspection evidence for page-by-page review
        uses: actions/upload-artifact@v4
        with:
          name: normam211-homologation-inspection
          path: docs/_normam211_inspection
          retention-days: 7
          if-no-files-found: error

  compose-smoke:
    needs: [detect-changes, ocr-integration]
    if: >-
      always() &&
      (github.event_name == 'push' ||
       needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.frontend == 'true' ||
       needs.detect-changes.outputs.ocr == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Confirm shared Compose smoke validation
        run: |
          echo "compose-smoke is executed inside ocr-integration to reuse the prebuilt PaddleOCR image."
          test "${{ needs.ocr-integration.result }}" = "success"

  pdf-mapping-visual:
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build the PDF mapper
        working-directory: backend
        run: npm run build
      - name: Install Poppler renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Generate review-only samples with synthetic names and CPFs
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render every page and assert the sample watermark
        run: |
          find docs/_pdf_test_previews -type f -name synthetic.pdf | sort | while read -r file; do
            directory=$(dirname "$file")
            pdftotext "$file" - | grep -q "AMOSTRA - DADOS FICTICIOS - NAO UTILIZAR"
            pdftoppm -r 140 -png "$file" "$directory/layout"
          done
      - name: Attach PDFs and PNGs for manual page-by-page QA
        uses: actions/upload-artifact@v4
        with:
          name: pdf-mapping-review-synthetic
          path: docs/_pdf_test_previews
          retention-days: 7
          if-no-files-found: error
