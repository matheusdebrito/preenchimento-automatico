name: Restore damaged normative PDFs (one-time)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  restore-official-pages:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/restore-corrupt-normam-pdf-assets-20261031'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install project dependencies and Poppler
        run: |
          npm ci --prefix backend
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Reproduce pages from exact official source
        run: node backend/scripts/repair-annex-assets.mjs
      - name: Commit restored binary pages only on the trusted PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/templates/declaracao-extravio-aquaviario/v1/original.pdf
          git add backend/templates/declaracao-residencia-aquaviario/v1/original.pdf
          git add backend/templates/termo-responsabilidade-er/v1/original.pdf
          git add backend/src/modules/catalog/aquaviario-services.ts
          git add backend/src/modules/catalog/vessel-services.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(pdf): restore legible official NORMAM annex pages"
          git push origin "HEAD:refs/heads/fix/restore-corrupt-normam-pdf-assets-20261031"
