name: Matriz E2E completa (manual)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-matrix-e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'test/e2e-full-service-matrix-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: test_only_e2e_matrix_2026
      OPENAI_API_KEY: ""
      DEV_GRANT_SECRET: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright runner, no persistent dependency changes
        run: |
          npm ci --prefix frontend
          npm install --no-save --package-lock=false --prefix frontend playwright@1.56.1
      - name: Start isolated PostgreSQL, API and UI
        run: docker compose up -d --build
      - name: Health check
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null &&
              curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1
      - name: Enumerate full conditional matrix and test pairwise browser cases
        run: node frontend/scripts/e2e-service-matrix.mjs
      - name: Add diagnostics on failure
        if: always()
        run: |
          mkdir -p browser-matrix-results
          docker compose ps > browser-matrix-results/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail=180 > browser-matrix-results/compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matriz-e2e-navegador
          path: browser-matrix-results/
          retention-days: 7
      - name: Remove test database and containers
        if: always()
        run: docker compose down -v || true
