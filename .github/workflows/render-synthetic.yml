name: Synthetic PDF preview (temporary)
on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/render-synthetic.mjs'
      - 'backend/src/modules/catalog/draft-mappings.ts'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and compile backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Render synthetic forms
        working-directory: backend
        run: node scripts/render-synthetic.mjs
      - name: Render previews and remove intermediate PDFs
        run: |
          find docs/_pdf_test_previews -type f -name synthetic.pdf | sort | while read -r file; do
            dir=$(dirname "$file")
            pdftoppm -r 110 -scale-to 1200 -png "$file" "$dir/page" >/dev/null 2>&1
            rm "$file"
          done
      - name: Commit synthetic preview images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_pdf_test_previews
          if ! git diff --cached --quiet; then
            git commit -m 'test(pdf): record synthetic renders for coordinate QA'
            git push origin HEAD:main
          fi
