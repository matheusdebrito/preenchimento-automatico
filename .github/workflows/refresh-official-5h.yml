name: Refresh official NORMAM-211 Anexo 5-H

on:
  push:
    branches:
      - feat/validate-all-pending-services
    paths:
      - .github/workflows/refresh-official-5h.yml

permissions:
  contents: write

jobs:
  refresh-5h:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/validate-all-pending-services

      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Extract complete Anexo 5-H from the official NORMAM-211
        shell: bash
        run: |
          set -euo pipefail
          target="backend/templates/requerimento-cha-amador/v1/original.pdf"
          source_pdf="$(mktemp --suffix=.pdf)"
          page1="$(mktemp --suffix=.pdf)"
          page2="$(mktemp --suffix=.pdf)"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://assets.marinha.mil.br/sites/default/files/atos-normativos/dpc/normam/normam-211.pdf" \
            --output "$source_pdf"

          total_pages="$(pdfinfo "$source_pdf" | awk '/^Pages:/ {print $2}')"
          if [ "$total_pages" -lt 255 ]; then
            echo "Official NORMAM-211 is shorter than expected: $total_pages pages" >&2
            exit 1
          fi

          pdfseparate -f 254 -l 255 "$source_pdf" "$(dirname "$page1")/normam-211-page-%d.pdf"
          mv "$(dirname "$page1")/normam-211-page-254.pdf" "$page1"
          mv "$(dirname "$page2")/normam-211-page-255.pdf" "$page2"

          pdftotext "$page1" - | grep -q "ANEXO 5-H"
          pdftotext "$page1" - | grep -q "REQUERIMENTO"
          pdftotext "$page2" - | grep -q "DESCRIÇÃO DO PEDIDO"

          pdfunite "$page1" "$page2" "$target"

          pages="$(pdfinfo "$target" | awk '/^Pages:/ {print $2}')"
          if [ "$pages" != "2" ]; then
            echo "Expected extracted Anexo 5-H to have 2 pages, got: $pages" >&2
            exit 1
          fi

          echo "Extracted official Anexo 5-H:"
          pdfinfo "$target" | grep -E '^(Pages|Page size|PDF version):'
          echo "SHA256=$(sha256sum "$target" | awk '{print toupper($1)}')"

      - name: Commit the official asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/templates/requerimento-cha-amador/v1/original.pdf
          if git diff --cached --quiet; then
            echo "Official 5-H already matches the versioned asset."
            exit 0
          fi
          git commit -m "Replace 5-H with complete official two-page form"
          git push origin HEAD:feat/validate-all-pending-services
