name: Refresh official NORMAM-211 Anexo 5-H

on:
  push:
    branches:
      - feat/validate-all-pending-services
    paths:
      - .github/workflows/refresh-official-5h.yml

permissions:
  contents: write

jobs:
  refresh-5h:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/validate-all-pending-services

      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Download official two-page Anexo 5-H
        shell: bash
        run: |
          set -euo pipefail
          target="backend/templates/requerimento-cha-amador/v1/original.pdf"
          tmp="$(mktemp)"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://www.marinha.mil.br/cpaor/sites/www.marinha.mil.br.cpaor/files/NORMAM%20211%20-%20ANEXO%205-H.pdf" \
            --output "$tmp"

          pages="$(pdfinfo "$tmp" | awk '/^Pages:/ {print $2}')"
          if [ "$pages" != "2" ]; then
            echo "Expected official Anexo 5-H to have 2 pages, got: $pages" >&2
            exit 1
          fi

          page_size_count="$(pdfinfo "$tmp" | grep -c '^Page size:')"
          if [ "$page_size_count" -lt 1 ]; then
            echo "Could not verify page geometry" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$target")"
          mv "$tmp" "$target"
          echo "Downloaded official Anexo 5-H:"
          pdfinfo "$target" | grep -E '^(Pages|Page size|PDF version):'
          echo "SHA256=$(sha256sum "$target" | awk '{print toupper($1)}')"

      - name: Commit the official asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/templates/requerimento-cha-amador/v1/original.pdf
          if git diff --cached --quiet; then
            echo "Official 5-H already matches the versioned asset."
            exit 0
          fi
          git commit -m "Replace 5-H with complete official two-page form"
          git push origin HEAD:feat/validate-all-pending-services
