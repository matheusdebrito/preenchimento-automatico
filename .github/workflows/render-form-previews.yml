name: Render official form previews (temporary)
on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/render-previews.sh'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Poppler
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Render blank official forms only
        run: sh backend/scripts/render-previews.sh
      - name: Commit screenshots without personal data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_pdf_previews
          if ! git diff --cached --quiet; then
            git commit -m 'chore(pdf): store blank form preview renders for mapping review'
            git push origin HEAD:main
          fi
